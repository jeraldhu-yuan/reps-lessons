<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<link rel="stylesheet" href="shared/reps.css">
<script src="shared/reps.js"></script>
</head>
<body>
<script>
const { C, rp, add, fmt, vec, pick, mat, apply, T, proj } = Reps;
const near = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]) < 0.1;
const eq = (a, b) => Math.abs(a - b) < 0.011;
const r2 = x => +x.toFixed(2) || 0;
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
const turn = d => d === 90 ? 'a quarter turn counter-clockwise' : d === -90 ? 'a quarter turn clockwise' : 'a half turn';
const rule = d => d === 90 ? '(x, y) → (−y, x)' : d === -90 ? '(x, y) → (y, −x)' : '(x, y) → (−x, −y)';

// ---- learn: three screens you can answer by eye, then the numbers, then the matrix ----

const landTip = v => {
  const { p, deg } = pick(v, [{ p: [3, 1], deg: 90 }, { p: [2, -1], deg: 90 }, { p: [1, 3], deg: -90 }, { p: [-2, 1], deg: 90 }]);
  const ans = rp(p, deg).map(Math.round);
  let a = 0;
  return {
    concept: 'rot-apply-2d',
    prompt: `A handpiece pivots about your fingertip at the origin. Its bur tip sits at <b>${vec(p)}</b>. You swing it ${turn(deg)}. <b>Tap where the tip lands.</b>`,
    visual: st => {
      st.draw = () => {
        st.grid(); st.line([0, 0], p, C.ghost, 6); st.dot(p, C.ghost, null, 5);
        if (a) { const t = rp(p, a); st.line([0, 0], t, C.fg, 6); st.dot(t, C.acc); } else st.dot(p, C.fg, 'tip');
        st.dot([0, 0], C.fg, null, 4);
      };
    },
    input: {
      type: 'point', answer: ans,
      why: t => near(t, p) ? 'That is where the tip starts. A quarter turn swings the handpiece until it is perpendicular to where it was.'
        : near(t, rp(p, -deg)) ? `That is a quarter turn ${deg > 0 ? 'clockwise' : 'counter-clockwise'}, the other direction. Counter-clockwise carries the +x direction toward +y.`
        : near(t, rp(p, 180)) ? 'That is a half turn. A quarter turn is 90°: the handpiece ends up perpendicular to where it started.'
        : Math.abs(Math.hypot(...t) - Math.hypot(...p)) > 0.1 ? `The handpiece does not stretch. The tip starts √${p[0] * p[0] + p[1] * p[1]} from the pivot and must end the same distance away. Your point is not.`
        : 'Right distance from the pivot, wrong angle. That spot is a mirror image of the tip, not a turn of it. After a quarter turn the handpiece is perpendicular to where it started.',
    },
    explain: `A quarter turn sends ${rule(deg)}: the two coordinates trade places and one changes sign. The whole plane moved as one rigid sheet with the pivot pinned.`,
    after: st => st.animate(900, t => { a = deg * t || 0.001; }),
  };
};

const rigid = v => {
  const k = pick(v, [{ ab: 3, ac: 4, ask: 'bc', deg: 137 }, { ab: 4, ac: 3, ask: 'angle', deg: 200 }, { ab: 3, ac: 4, ask: 'ab', deg: 71 }, { ab: 4, ac: 3, ask: 'ac', deg: 250 }]);
  const A = [-1, -1], B = [k.ab - 1, -1], Cc = [-1, k.ac - 1];   // pivot inside the tooth, so labels never reach the edge
  const angleAt = (o, p, q) => Math.acos(((p[0] - o[0]) * (q[0] - o[0]) + (p[1] - o[1]) * (q[1] - o[1])) / (dist(o, p) * dist(o, q))) * 180 / Math.PI;
  const bc = r2(dist(B, Cc)), ans = { bc, angle: r2(angleAt(A, B, Cc)), ab: k.ab, ac: k.ac }[k.ask];
  const ask = { bc: 'how far is B from C', angle: 'what is the angle at A', ab: 'how far is A from B', ac: 'how far is A from C' }[k.ask];
  const leg = k.ask === 'ab' ? ['B', k.ab, 'C', k.ac] : ['C', k.ac, 'B', k.ab];
  let a = 0, a0 = 0, g0 = 0, reveal = false;
  return {
    concept: 'rot-preserves',
    prompt: `Three marks on a tooth: A to B is ${k.ab} mm, A to C is ${k.ac} mm, with a right angle at A. <b>Drag to spin the tooth</b> about the origin. After a ${k.deg}° turn, <b>${ask}?</b>`,
    visual: st => {
      st.draw = () => {
        const [a1, b1, c1] = [A, B, Cc].map(p => rp(p, a));
        st.grid(false); st.poly([a1, b1, c1], C.fg, 'rgba(255,255,255,.08)');
        st.dot(a1, C.acc, 'A'); st.dot(b1, C.x, 'B'); st.dot(c1, C.z, 'C'); st.dot([0, 0], C.fg, null, 4);
        st.readout(reveal ? `B is at ${vec(b1)}<br>A–B ${fmt(dist(a1, b1))} mm · B–C ${fmt(dist(b1, c1))} mm · angle at A ${fmt(angleAt(a1, b1, c1))}°` : '');
      };
      st.drag((w, ph) => { const g = Math.atan2(w[1], w[0]) * 180 / Math.PI; if (ph === 'down') { g0 = g; a0 = a; } else a = a0 + g - g0; });
    },
    input: {
      type: 'number', answer: ans, unit: k.ask === 'angle' ? '°' : 'mm',
      why: x => k.ask === 'angle'
        ? ([k.deg, 90 + k.deg, Math.abs(90 - k.deg), (90 + k.deg) % 360].some(y => eq(x, y)) ? `You folded the ${k.deg}° turn into the answer. ` : '')
          + `The angle at A is the angle between the edges A–B and A–C. Both edges swing by the same ${k.deg}°, so the angle between them is still the right angle it started as. Spin the tooth and check.`
        : k.ask === 'bc'
          ? (eq(x, k.ab + k.ac) ? `${k.ab} + ${k.ac} is the walk along the two edges. B to C is the straight line across. `
            : eq(x, k.ab) || eq(x, k.ac) ? `That is the length of one of the edges at A. B to C is the long side, across from the right angle. `
            : eq(x, k.deg) ? `${k.deg} is the size of the turn, not a distance. ` : '')
            + `Spin it and watch: the triangle never stretches or shears, so B to C is what it was before the turn, √(${k.ab}² + ${k.ac}²) mm. The size of the turn does not enter.`
          : (eq(x, leg[3]) ? `That is A to ${leg[2]}. ` : eq(x, bc) ? 'That is B to C, the long side. ' : eq(x, k.deg) ? `${k.deg} is the size of the turn, not a distance. ` : '')
            + `A to ${leg[0]} was ${leg[1]} mm before the turn. Spin it and watch: the triangle moves as one piece, so every distance in it stays what it was. The size of the turn does not enter.`,
    },
    explain: 'A rotation is rigid. Every length and every angle on the tooth is unchanged. Only the coordinates of the points change: keep spinning and watch the readout. That is the definition, before any matrix shows up.',
    after: st => { reveal = true; const from = a; st.animate(1200, t => { a = from + (k.deg - from) * t; }); },
  };
};

const burMarks = (ask, opts) => {
  let spin = 0, yaw = 35, pitch = 20, last = null;
  const A = [0, 0, -1.6], Cm = [0, 0, 1.6], r = 0.7;
  return {
    concept: 'rot-axis-3d',
    prompt: `In 3D the pivot is a line. This bur spins a quarter turn about its shank axis (blue). <b>Drag to look around.</b> A is the tip centre, C the shank centre, B sits on the rim. ${ask}`,
    view: [-3.2, 3.2, -2.9, 2.9],
    visual: st => {
      st.draw = () => {
        const P = proj(yaw, pitch), ringAt = z => Array.from({ length: 40 }, (_, i) => P([r * Math.cos(i * Math.PI / 20), r * Math.sin(i * Math.PI / 20), z]));
        const B = [r * Math.cos(Reps.rad(spin)), r * Math.sin(Reps.rad(spin)), 0];
        st.line(P([0, 0, -2.7]), P([0, 0, 2.7]), C.z, 1.5, [5, 5]);
        st.poly(ringAt(-1.6), C.ghost); st.poly(ringAt(1.6), C.ghost); st.poly(ringAt(0), C.line, null, 1);
        for (const t of [0, 90, 180, 270]) { const c = Math.cos(Reps.rad(t + spin)) * r, s = Math.sin(Reps.rad(t + spin)) * r; st.line(P([c, s, -1.6]), P([c, s, 1.6]), C.ghost, 1.5); }
        st.dot(P(A), C.acc); st.label(P(A), 'A', C.acc, [-48, 0]); st.dot(P(Cm), C.y); st.label(P(Cm), 'C', C.y, [-48, 0]); st.dot(P(B), C.x, 'B');
      };
      st.drag((w, ph) => { if (ph !== 'down' && last) { yaw -= (w[0] - last[0]) * 40; pitch = Math.max(-80, Math.min(80, pitch + (w[1] - last[1]) * 40)); } last = ph === 'up' ? null : w; });
    },
    input: { type: 'choice', cols: 2, options: opts },
    explain: 'Every 3D rotation has an axis: the line of points it leaves exactly where they were. Everything off the axis travels on a circle around it. This matters for your bur: spinning a symmetric cylinder about its own axis changes nothing a camera can see, which is why Unit 5 recovers a 5-DoF pose instead of 6.',
    after: st => st.animate(1400, t => { spin = 90 * t; }),
  };
};
const axis3d = v => burMarks(...pick(v, [
  ['<b>Which marks end up exactly where they started?</b>', [
    { html: 'Only A', why: 'A stays, yes. But C is on the same line through the middle of the bur. What would carry it anywhere?' },
    { html: 'A and C', correct: true },
    { html: 'None of them', why: 'Not everything on a turning body goes somewhere. Think of a spinning top: the points along its spindle turn in place.' },
    { html: 'All three', why: 'B sits on the rim, 0.7 from the axis. A quarter turn carries it a quarter of the way around.' }]],
  ['<b>Which marks move to a new position?</b>', [
    { html: 'A, B and C', why: 'A and C sit on the axis itself. Points on the axis have no circle to travel on.' },
    { html: 'B and C', why: 'C is at the centre of the shank, right on the axis. It turns in place.' },
    { html: 'Only B', correct: true },
    { html: 'None of them', why: 'B is on the rim, off the axis. It travels a quarter circle.' }]],
]));

const columns = v => {
  const { c, s, p } = pick(v, [{ c: 0.8, s: 0.6, p: [2, 1] }, { c: 0.6, s: 0.8, p: [2, 1] }, { c: 0.8, s: 0.6, p: [3, 1] }, { c: 0.6, s: 0.8, p: [1, 2] }]);
  const u = [c, s], w = [-s, c], R = [[c, -s], [s, c]], q = apply(R, p).map(r2);
  let shown = 0;
  return {
    concept: 'rot-columns',
    prompt: `Back in 2D. The plane turned and its unit arrows rode along: <span class="cx">x̂</span> landed on <b>${vec(u)}</b>, <span class="cy">ŷ</span> on <b>${vec(w)}</b>. The mark p was at ${p[0]}<span class="cx">x̂</span> + ${p[1]}<span class="cy">ŷ</span> and is glued to the plane. <b>What is the x-coordinate of where p lands?</b>`,
    view: [-2, 4, -1, 4],
    visual: st => {
      st.draw = () => {
        st.grid(); st.arrow([0, 0], [1, 0], C.ghost, 2); st.arrow([0, 0], [0, 1], C.ghost, 2); st.dot(p, C.ghost, 'p before', 5);
        st.arrow([0, 0], u, C.x); st.arrow([0, 0], w, C.y);
        if (shown) {
          const m = u.map(x => x * p[0] * Math.min(1, shown * 2)), e = add(m, w.map(x => x * p[1] * Math.max(0, shown * 2 - 1)));
          st.arrow([0, 0], m, C.x, 2); st.arrow(m, e, C.y, 2); if (shown === 1) st.dot(q, C.acc, 'p after');
        }
      };
    },
    input: {
      type: 'number', answer: q[0],
      why: x => eq(x, p[0] * c + p[1] * s) ? `Check the sign: ŷ landed on ${vec(w)}, so its x-part is negative and pulls p to the left.`
        : eq(x, p[0]) ? `p had x-coordinate ${p[0]} before the turn, but it is glued to the plane and moved with the arrows. Add up the x-parts of ${p[0]}·${vec(u)} and ${p[1]}·${vec(w)}.`
        : eq(x, q[1]) ? 'That is the y-coordinate. Add up the x-parts of the two landed arrows instead.'
        : eq(x, p[0] * c) ? `That is only the x̂ part, ${p[0]}·${c}. p also carries ${p[1]} of ŷ, and ŷ landed on ${vec(w)}: add ${p[1]}·(${fmt(-s)}).`
        : `p is still ${p[0]} of x̂ plus ${p[1]} of ŷ, just using the landed arrows: ${p[0]}·${vec(u)} + ${p[1]}·${vec(w)}. Add the x-parts.`,
    },
    explain: `p lands on ${p[0]}·${vec(u)} + ${p[1]}·${vec(w)} = <b>${vec(q)}</b>. Write the two landed arrows as columns and you have the rotation matrix: R = ${mat(R)}. Multiplying R by p is exactly this recipe.`,
    after: st => st.animate(1200, t => { shown = t; }),
  };
};

const M = { ccw: [[0, -1], [1, 0]], cw: [[0, 1], [-1, 0]], swap: [[0, 1], [1, 0]], half: [[-1, 0], [0, -1]] };
const readMatrix = v => {
  const any = 'a rotation (some angle, no stretching, no flipping)';
  const sets = [
    { ask: 'a quarter turn counter-clockwise', opts: [
      { html: mat(M.cw), why: 'Read the first column: x̂ lands on (0, −1), pointing down. That is clockwise.' },
      { html: mat(M.ccw), correct: true },
      { html: mat(M.swap), why: 'x̂ lands on (0, 1), fine. But ŷ lands on (1, 0): the two arrows traded places. That is a mirror flip across the diagonal, not a turn.' },
      { html: mat(M.half), why: 'x̂ lands on (−1, 0), pointing backwards. That is a half turn.' }] },
    { ask: any, opts: [
      { html: mat([[0.6, 0.8], [0.8, 0.6]]), why: 'The columns (0.6, 0.8) and (0.8, 0.6) are unit length but not perpendicular. The grid would be squashed.' },
      { html: mat([[1, 1], [0, 1]]), why: 'ŷ lands on (1, 1), which has length √2 and leans over. That is a shear.' },
      { html: mat([[2, 0], [0, 2]]), why: 'Both arrows doubled in length. That is scaling.' },
      { html: mat([[0.6, -0.8], [0.8, 0.6]]), correct: true }] },
    { ask: 'a quarter turn clockwise', opts: [
      { html: mat(M.cw), correct: true },
      { html: mat(M.half), why: 'x̂ lands on (−1, 0). That is a half turn.' },
      { html: mat(M.ccw), why: 'Read the first column: x̂ lands on (0, 1), pointing up. That is counter-clockwise.' },
      { html: mat([[0, -1], [-1, 0]]), why: 'x̂ lands on (0, −1), fine. But ŷ lands on (−1, 0), which is a flip, not a turn. A turn would carry ŷ to (1, 0).' }] },
    { ask: any, opts: [
      { html: mat([[0.8, 0.6], [0.6, -0.8]]), why: 'Unit length and perpendicular, but ŷ landed on (0.6, −0.8), a quarter turn clockwise of x̂ instead of counter-clockwise. The plane was flipped over: a mirror image.' },
      { html: mat([[0.8, 0.6], [-0.6, 0.8]]), correct: true },
      { html: mat([[0.5, -0.5], [0.5, 0.5]]), why: 'The columns are perpendicular, but (0.5, 0.5) has length 0.71, not 1. Everything would shrink.' },
      { html: mat([[1, 0.6], [0, 0.8]]), why: 'Both columns have unit length, but (1, 0) and (0.6, 0.8) are not perpendicular. That is a shear: squares become slanted.' }] },
  ];
  const k = pick(v, sets);
  return {
    concept: 'rot-valid',
    prompt: `Columns are where <span class="cx">x̂</span> and <span class="cy">ŷ</span> land. <b>Which matrix is ${k.ask}?</b>`,
    input: { type: 'choice', cols: 2, options: k.opts },
    explain: 'Read any 2×2 by its columns: first column is where x̂ lands, second is where ŷ lands. It is a rotation exactly when the columns have unit length, are perpendicular, and keep their handedness (ŷ stays a quarter turn counter-clockwise of x̂).',
  };
};

const undo = v => {
  const { c, s } = pick(v, [{ c: 0.6, s: 0.8 }, { c: 0.8, s: -0.6 }, { c: 0.8, s: 0.6 }, { c: 0.6, s: -0.8 }]);
  const R = [[c, -s], [s, c]], start = Math.atan2(s, c) * 180 / Math.PI;
  const shape = [[0, 0], [1.25, 0], [1.25, 0.65], [0.65, 0.65], [0.65, 2.1], [0, 2.1]];
  let a = start, a0 = 0, g0 = 0, shown = false;
  const off = () => ((a % 360) + 540) % 360 - 180;
  const opts = [
    { html: mat(R), why: `That is R again. A second R turns the scan further the same way. The turn back sends x̂ to ${vec([c, -s])}; this matrix sends it to ${vec([c, s])}.` },
    { html: mat(R.map(r => r.map(x => -x))), why: `Negating every entry gives R plus a half turn: x̂ would land on ${vec([-c, -s])}. A minus sign undoes a number, not a turn.` },
    { html: mat(T(R)), correct: true },
    { html: mat(R.map(r => r.map(x => 1 / x))), why: `1/${c} = ${fmt(1 / c)} undoes multiplying by a single number. As a matrix its columns are longer than 1, so it would stretch the scan. The turn back is still a rotation, with unit columns.` },
  ];
  return {
    concept: 'rot-inverse',
    prompt: `A tooth scan (yellow) came in turned by R = ${mat(R)} against the reference (grey). <b>Drag it back.</b> The arrows show where your turn sends <span class="cx">x̂</span> and <span class="cy">ŷ</span>. <b>Which matrix turns the scan back?</b>`,
    view: [-3, 3, -2.3, 2.3],
    visual: st => {
      st.draw = () => {
        const ux = rp([1, 0], a - start), uy = rp([0, 1], a - start);
        st.grid(); st.poly(shape, C.ghost, 'rgba(255,255,255,.05)');
        st.poly(shape.map(p => rp(p, a)), C.acc, 'rgba(255,212,59,.12)', 2.5);
        st.arrow([0, 0], ux, C.x); st.arrow([0, 0], uy, C.y); st.dot([0, 0], C.fg, null, 4);
        st.readout(shown ? `x̂ → ${vec(ux.map(r2))} &nbsp; ŷ → ${vec(uy.map(r2))}` : '');
      };
      st.drag((w, ph) => {
        const g = Math.atan2(w[1], w[0]) * 180 / Math.PI;
        if (ph === 'down') { g0 = g; a0 = a; } else a = a0 + g - g0;
        if (ph === 'up' && Math.abs(off()) < 4) a = 0;
      });
    },
    input: { type: 'choice', cols: 2, options: opts.map((_, j) => opts[(j + (v % 4) + 4) % 4]) },
    explain: `Turning back by the same angle sends x̂ to ${vec([c, -s])} and ŷ to ${vec([s, c])}. Those columns are the rows of R. Undoing a rotation never needs a general matrix inverse: <b>R⁻¹ = Rᵀ</b>, the transpose, where columns become rows.`,
    after: st => { shown = true; const from = off(); st.animate(700, t => { a = from * (1 - t); }); },
  };
};

// ---- problems ----

const toothOutline = [[-1, -0.8], [-0.4, -1.1], [0.4, -1.1], [1, -0.8], [1.1, 0.5], [0.5, 0.9], [0, 0.6], [-0.5, 0.9], [-1.1, 0.5]].map(p => add(p, [-2, -2]));
const pApply = v => {
  const k = pick(v, [{ p: [2, 1], deg: 90, i: 1 }, { p: [1, 3], deg: 90, i: 0 }, { p: [3, 2], deg: -90, i: 1 }, { p: [1, 2], deg: 180, i: 0 }, { p: [2, 3], deg: 90, i: 0 }]);
  const q = rp(k.p, k.deg).map(r2), n = 'xy'[k.i], m = 'yx'[k.i];
  let a = 0, done = false;
  return {
    concept: 'rot-apply-2d',
    prompt: `The camera sees the bur tip at <b>${vec(k.p)}</b>, measured from the image centre. Its elastic mount lets it roll, so the whole picture turns ${turn(k.deg)} about the centre. Nothing in the mouth moved. <b>What is the tip's new ${n}-coordinate?</b>`,
    visual: st => {
      st.draw = () => {
        st.grid();
        if (a) { st.poly(toothOutline, C.ghost, null, 1.5); st.dot(k.p, C.ghost, null, 5); }
        st.poly(toothOutline.map(p => rp(p, a)), C.fg, 'rgba(255,255,255,.08)'); st.label(rp([-2, -2], a), 'tooth', C.fg);
        const t = rp(k.p, a); st.dot(t, C.acc); st.label(t, 'tip', C.acc, [t[0] < 0 ? -10 : 10, -10]);
        st.readout(done ? `tip ${vec(k.p)} → ${vec(q)}, tooth turned too` : '');
      };
    },
    input: {
      type: 'number', answer: q[k.i],
      why: x => k.deg !== 180 && eq(x, -q[k.i]) ? `That is the quarter turn in the other direction. ${turn(k.deg)[0].toUpperCase() + turn(k.deg).slice(1)} sends ${rule(k.deg)}.`
        : eq(x, k.p[k.i]) ? `That is the old ${n}-coordinate. The picture turned, so the tip shows up somewhere else in it.`
        : eq(x, q[1 - k.i]) ? `That is the new ${m}-coordinate: the tip lands on ${vec(q)}. The question asks for ${n}.`
        : `Turn the tip like the handpiece: same distance from the centre, ${k.deg === 180 ? 'pointing the opposite way' : 'perpendicular to where it was'}. Check your point against ${rule(k.deg)}.`,
    },
    explain: `${turn(k.deg)[0].toUpperCase() + turn(k.deg).slice(1)} sends ${rule(k.deg)}, so the tip shows up at ${vec(q)}. The tooth turned with it: every camera coordinate changed, but the bur did not move against the tooth. The elastic mount does this constantly, so no fixed camera-to-bur offset exists. Your pipeline measures the bur relative to the tooth, frame by frame.`,
    after: st => { done = true; st.animate(1100, t => { a = k.deg * t || 0.001; }); },
  };
};

const pColumns = v => {
  const k = pick(v, [{ c: 0.6, s: 0.8, p: [5, 10], i: 0 }, { c: 0.6, s: 0.8, p: [10, 5], i: 1 }, { c: 0.8, s: 0.6, p: [5, 5], i: 1 }, { c: 0.8, s: 0.6, p: [10, -5], i: 0 }, { c: 0.8, s: 0.6, p: [5, 10], i: 0 }]);
  const R = [[k.c, -k.s], [k.s, k.c]], q = apply(R, k.p).map(r2), c1 = [k.c, k.s], c2 = [-k.s, k.c], n = 'xy'[k.i], m = 'yx'[k.i];
  return {
    concept: 'rot-columns',
    prompt: `R = ${mat(R)} rotates the plane. The point p = <b>${vec(k.p)}</b> rides along. <b>What is the ${n}-coordinate of R·p?</b>`,
    input: {
      type: 'number', answer: q[k.i],
      why: x => eq(x, k.p[k.i]) ? `That is p's own ${n}-coordinate from before the turn. p rode along with the plane.`
        : eq(x, apply(T(R), k.p)[k.i]) ? `That mixes up rows and columns: you got Rᵀ·p, the opposite turn. Read R down its columns: x̂ lands on ${vec(c1)}, ŷ on ${vec(c2)}.`
        : eq(x, q[1 - k.i]) ? `That is the ${m}-coordinate. The question asks for ${n}.`
        : eq(x, k.p[0] * c1[k.i]) ? `That is only the first column's share, ${k.p[0]}·${c1[k.i]}. Add ${k.p[1]} times the ${n}-part of the second column.`
        : `Use the columns: R·p is ${k.p[0]} of the first column plus ${k.p[1]} of the second. Check your result: it must be as far from the origin as p is.`,
    },
    explain: `R·p = ${k.p[0]}·(first column) + ${k.p[1]}·(second column) = ${k.p[0]}·${vec(c1)} + ${k.p[1]}·${vec(c2)} = ${vec(q)}.`,
  };
};

const pAxis = v => {
  const k = pick(v, [{ p: [1, 0, 2], i: 2 }, { p: [3, 0, 1], i: 1 }, { p: [0, 2, 5], i: 0 }, { p: [3, 0, -1], i: 2 }, { p: [2, 1, 4], i: 0 }]);
  const q = [-k.p[1] || 0, k.p[0], k.p[2]], n = 'xyz'[k.i];
  return {
    concept: 'rot-axis-3d',
    prompt: `A bur's shank lies along the z-axis. A mark on the bur sits at <b>${vec(k.p)}</b>. The bur spins a quarter turn about its shank, counter-clockwise seen from +z. <b>What is the mark's new ${n}-coordinate?</b>`,
    input: {
      type: 'number', answer: q[k.i],
      why: x => k.i === 2 ? `The turn is about the z-axis, so nothing moves along z: the mark keeps z = ${k.p[2]}. Only its x and y change.`
        : eq(x, -q[k.i]) ? 'That is the clockwise quarter turn. Counter-clockwise seen from +z sends (x, y) → (−y, x).'
        : eq(x, k.p[k.i]) ? `That is the old ${n}-coordinate. Only z is untouched; x and y make a quarter turn around the shank.`
        : eq(x, k.p[2]) ? `That is z, which the turn leaves alone. The question asks for ${n}.`
        : eq(x, q[1 - k.i]) ? `That is the new ${'yx'[k.i]}-coordinate: the mark lands on ${vec(q)}.`
        : `Split the mark in two. Its z (${k.p[2]}) lies along the axis and stays. Its (x, y) = ${vec(k.p.slice(0, 2))} makes the flat quarter turn (x, y) → (−y, x). Check: the mark must stay the same distance from the shank.`,
    },
    explain: `The z-axis is the rotation axis, so z is untouched. In the x-y plane it is the familiar quarter turn (x, y) → (−y, x). ${vec(k.p)} lands on ${vec(q)}.`,
  };
};

const pInverse = v => {
  const k = pick(v, [{ c: 0.8, s: 0.6, p: [10, -5], i: 1 }, { c: 0.8, s: 0.6, p: [5, 10], i: 1 }, { c: 0.6, s: 0.8, p: [5, 5], i: 0 }, { c: 0.8, s: 0.6, p: [5, 5], i: 0 }, { c: 0.6, s: 0.8, p: [10, 5], i: 0 }]);
  const R = [[k.c, -k.s], [k.s, k.c]], Rt = T(R), q = apply(R, k.p).map(r2), ans = apply(Rt, q).map(r2), n = 'xy'[k.i];
  return {
    concept: 'rot-inverse',
    prompt: `A tooth scan came in turned by R = ${mat(R)} from its reference pose. After that turn, a pit sits at <b>${vec(q)}</b>. <b>What was the pit's ${n}-coordinate before the turn?</b>`,
    input: {
      type: 'number', answer: ans[k.i],
      why: x => eq(x, apply(R, q)[k.i]) ? 'That applies R a second time, which turns the pit further the same way. To go back, use the transpose Rᵀ.'
        : eq(x, q[k.i]) ? `That is where the pit sits after the turn. Turn it back with Rᵀ.`
        : eq(x, ans[1 - k.i]) ? `That is the ${'yx'[k.i]}-coordinate. The question asks for ${n}.`
        : eq(x, -ans[k.i]) ? 'Check the signs: transposing moves the minus sign to the other off-diagonal entry.'
        : `The likely slip is using R itself, or inverting it entry by entry. Undo a rotation with its transpose, then apply that to the pit. Check your answer: applying R to it must give ${vec(q)} back.`,
    },
    explain: `The inverse of a rotation is its transpose: columns become rows, so Rᵀ = ${mat(Rt)} here. Rᵀ·${vec(q)} = ${q[0]}·${vec([k.c, -k.s])} + ${q[1]}·${vec([k.s, k.c])} = ${vec(ans)}. Applying R to that gives ${vec(q)} again.`,
  };
};

Reps.lesson({
  id: 'u1-rotations',
  title: 'Rotations',
  learn: [landTip, rigid, axis3d, columns, readMatrix, undo],
  problems: [pApply, pColumns, pAxis, pInverse],
});
